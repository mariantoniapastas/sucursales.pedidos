<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d9cdb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mariantonia – Pedidos</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    background-color: #d9cdb8;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    padding: 2rem 1.5rem;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 400px;
  }
  .logo {
    width: min(220px, 58vw);
    margin-bottom: 1.2rem;
  }
  .iso-wrapper {
    width: min(200px, 52vw);
    height: min(200px, 52vw);
    border-radius: 50%;
    background: #ece5d7;
    overflow: hidden;
    margin-bottom: 2rem;
    flex-shrink: 0;
    position: relative;
  }
  .iso-wrapper img {
    position: absolute;
    width: 195%;
    top: -6%;
    left: -36%;
  }
  .subtitle {
    font-size: clamp(12px, 3.5vw, 15px);
    color: #4a4233;
    margin-bottom: 1.6rem;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 3vw, 16px);
    width: 100%;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border-radius: 50px;
    padding: clamp(14px, 4vw, 18px) clamp(20px, 5vw, 26px);
    text-decoration: none;
    color: #1a2a3a;
    font-size: clamp(17px, 4.5vw, 20px);
    font-weight: 700;
    font-style: italic;
    min-height: 62px;
    touch-action: manipulation;
  }
  .btn:active {
    background: #ede7db;
    transform: scale(0.98);
  }
  .arrow {
    font-size: clamp(20px, 5vw, 24px);
    color: #7a7340;
    font-style: normal;
    font-weight: 700;
    flex-shrink: 0;
    margin-left: 10px;
  }
  .btn-label { display: flex; flex-direction: column; }
  .badge {
    display: block;
    font-size: clamp(10px, 2.5vw, 12px);
    font-weight: 400;
    font-style: normal;
    color: #888;
    letter-spacing: 0.02em;
    margin-top: 3px;
  }
</style>
</head>
